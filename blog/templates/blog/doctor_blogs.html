<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog Posts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Poppins', sans-serif;
            padding: 100px 20px 40px 20px; /* top padding for fixed navbar */
        }
        h2 {
            text-align: center;
            margin-bottom: 40px;
            color: #343a40;
            font-weight: 700;
        }
        .blog-item {
            background: #ffffff;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .blog-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .blog-item img {
            max-width: 150px;
            border-radius: 10px;
            margin: 10px 0;
        }
        .blog-item h3 {
            color: #2575fc;
            font-weight: 600;
        }
        .blog-item p {
            color: #555;
            margin: 5px 0;
        }
        .status {
            font-weight: 500;
            color: #fff;
            background-color: #6c757d;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.85rem;
        }
        .status.published {
            background-color: #28a745;
        }
        hr {
            border-top: 1px solid #dee2e6;
        }
        .no-blogs {
            text-align: center;
            color: #6c757d;
            font-style: italic;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success fixed-top shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">Hospital System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" 
                aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarContent">
                <div class="d-flex align-items-center">
                    <a href="{% url 'patient_blogs' %}" class="btn btn-outline-light btn-sm me-2">Blog</a>
                    <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    <div class="container">
        <h2>My Blog Posts</h2>

        {% for blog in blogs %}
            <div class="blog-item">
                <h3>{{ blog.title }}</h3>
                {% if blog.image %}
                    <img src="{{ blog.image.url }}" alt="{{ blog.title }}">
                {% endif %}
                <p>{{ blog.short_summary }}</p>
                <p>
                    Status: 
                    <span class="status {% if not blog.is_draft %}published{% endif %}">
                        {{ blog.is_draft|yesno:"Draft,Published" }}
                    </span>
                </p>
                <hr>
            </div>
        {% empty %}
            <p class="no-blogs">No posts yet.</p>
        {% endfor %}
    </div>

    <!-- Bootstrap JS for navbar toggle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
